version: 2

models:
  - name: feat_airquality
    description: Final per-hour feature table — PM2.5 + weather + lags + trailing rolling + local-time calendar.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, valid_time]
    columns:
      - name: station_id
        tests: [not_null]
      - name: valid_time
        tests: [not_null]
      - name: pm25
        tests: [not_null]
