transform:
  target: prod

  outputs:
    prod:
      type: postgres
      host: "{{ env_var('SUPABASE_DB_HOST') }}"
      port: 5432
      user: "{{ env_var('SUPABASE_DB_USER') }}"
      password: "{{ env_var('SUPABASE_DB_PASSWORD') }}"
      dbname: postgres
      schema: analytics
      threads: 2
      sslmode: require