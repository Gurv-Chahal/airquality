name: forecast-pipeline

on:
  schedule:
    - cron: "0 14 * * *"   # daily at 14:00 UTC = 6/7am Pacific
  workflow_dispatch:        # adds a manual "Run workflow" button for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest PM2.5
        run: python -m ingest.ingest_pm25

      - name: Ingest weather
        run: python -m ingest.ingest_weather

      - name: Rebuild + test feature table (dbt)
        working-directory: pipeline/transform
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt run
          dbt test

      - name: Run forecast
        run: python -m inference.run_forecast

      - name: Evaluate forecasts
        run: python -m inference.run_eval